<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bài tập Toán lớp 2</title>

<style>
  
<style>
  
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}


/* =========================================================
   QUIZ LAYOUT
========================================================= */

.quiz-container-1 {
    display: flex;
    gap: 24px;

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;
    padding: 20px 0;
}

.quiz-main-1 {
    flex: 1;
    min-width: 0;
}

.questions-list-1 {
    width: 100%;
}


/* =========================================================
   QUESTION
========================================================= */

.question-item-1 {
    margin-bottom: 20px;
    padding: 20px;

    background: #fff;

    border: 1px solid #e5e7eb;
    border-radius: 14px;

    scroll-margin-top: 20px;
}

.question-number-1 {
    margin: 0 0 12px;

    font-size: 21px;
    color: #111827;
}

.question-text-1 {
    margin-bottom: 18px;

    font-size: 18px;
    line-height: 1.65;
}


/* =========================================================
   QUESTION IMAGE
========================================================= */

.question-image-1 {
    margin: 15px 0;

    text-align: center;
}

.question-image-1 img {
    display: block;

    max-width: 100%;
    height: auto;

    margin: auto;
}


/* =========================================================
   ANSWERS
========================================================= */

.answers-1 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 12px;
}

.answer-1 {
    display: flex;
    align-items: center;

    gap: 12px;

    width: 100%;
    min-height: 52px;

    padding: 0 14px;

    box-sizing: border-box;

    background: #fff;

    border: 1px solid #d1d5db;
    border-radius: 10px;

    cursor: pointer;

    transition: .2s;
}

.answer-1:hover {
    background: #f8fafc;
    border-color: #94a3b8;
}

.answer-1 input {
    display: none;
}

.answer-label-1 {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    background: #eef2f7;

    border-radius: 50%;

    font-weight: bold;
}

.answer-content-1 {
    flex: 1;
    min-width: 0;

    font-size: 17px;
    line-height: 1.4;
}


/* =========================================================
   ANSWER STATES
========================================================= */

/* Selected */

.answer-1.selected-1 {
    background: #eff6ff;
    border-color: #2563eb;
}


/* Correct */

.answer-1.correct-1 {
    background: #f0fdf4;
    border-color: #16a34a;
}

.answer-1.correct-1 .answer-label-1 {
    background: #16a34a;
    color: #fff;
}


/* Wrong */

.answer-1.wrong-1 {
    background: #fef2f2;
    border-color: #dc2626;
}

.answer-1.wrong-1 .answer-label-1 {
    background: #dc2626;
    color: #fff;
}


/* =========================================================
   TEXT ANSWER
========================================================= */

.text-answer-box-1 {
    display: flex;
    align-items: stretch;

    gap: 10px;

    width: 100%;

    margin-top: 15px;
}

.text-answer-input-1 {
    flex: 1 1 auto;

    min-width: 0;
    height: 52px;

    padding: 0 14px;

    box-sizing: border-box;

    background: #fff;

    border: 1px solid #cbd5e1;
    border-radius: 9px;

    font-size: 17px;
}

.text-answer-input-1:focus {
    outline: none;

    border-color: #2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, .10);
}

.text-answer-input-1.correct-1 {
    background: #f0fdf4;
    border-color: #16a34a;
}

.text-answer-input-1.wrong-1 {
    background: #fef2f2;
    border-color: #dc2626;
}


/* =========================================================
   CHECK BUTTON
========================================================= */

.check-answer-btn-1 {
    min-width: 105px;
    height: 52px;

    padding: 0 17px;

    box-sizing: border-box;

    background: #2563eb;
    color: #fff;

    border: 0;
    border-radius: 9px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.check-answer-btn-1:hover {
    background: #1d4ed8;
}


/* =========================================================
   LOCKED / DISABLED
========================================================= */

.question-item-1.answered-1 .answer-1 {
    pointer-events: none;
    cursor: default;
}

.text-answer-input-1:disabled {
    opacity: 1;

    color: #222;

    cursor: not-allowed;

    -webkit-text-fill-color: #222;
}

.check-answer-btn-1:disabled {
    opacity: 1;

    background: #94a3b8;
    color: #fff;

    cursor: not-allowed;
}


/* =========================================================
   SOLUTION
========================================================= */

.solution-1 {
    display: none;

    margin-top: 16px;
    padding: 14px 16px;

    background: #eff6ff;

    border-left: 4px solid #2563eb;
    border-radius: 8px;

    font-size: 16px;
    line-height: 1.65;
}

.solution-1.show-1 {
    display: block;
}


/* =========================================================
   SIDEBAR
========================================================= */

.quiz-sidebar-1 {
    position: sticky;
    top: 15px;

    align-self: flex-start;

    width: 280px;

    flex: 0 0 280px;

    padding: 18px;

    background: #fff;

    border: 1px solid #e5e7eb;
    border-radius: 14px;
}

.sidebar-title-1 {
    margin: 0 0 18px;

    text-align: center;

    font-size: 20px;
}

.quiz-close-btn-1 {
    display: none;
}


/* =========================================================
   STATS
========================================================= */

.stats-1 {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 18px;
}

.stat-1 {
    padding: 10px 6px;

    background: #f8fafc;

    border-radius: 10px;

    text-align: center;
}

.stat-number-1 {
    display: block;

    font-size: 22px;
    font-weight: bold;
}

.stat-label-1 {
    display: block;

    margin-top: 3px;

    font-size: 15px;
    color: #475569;
}


/* =========================================================
   QUESTION GRID
========================================================= */

.question-grid-1 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);

    gap: 8px;
}

.question-btn-1 {
    min-width: 0;

    aspect-ratio: 1;

    background: #fff;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.question-btn-1:hover {
    border-color: #2563eb;
}

.question-btn-1.current-1 {
    outline: 2px solid #2563eb;
}

.question-btn-1.correct-1 {
    background: #16a34a;
    color: #fff;

    border-color: #16a34a;

    outline: none;
}

.question-btn-1.wrong-1 {
    background: #dc2626;
    color: #fff;

    border-color: #dc2626;

    outline: none;
}


/* =========================================================
   LEGEND
========================================================= */

.legend-1 {
    display: grid;

    gap: 8px;

    margin-top: 20px;
    padding-top: 16px;

    border-top: 1px solid #eee;
}

.legend-item-1 {
    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 14px;
}

.legend-box-1 {
    width: 18px;
    height: 18px;

    background: #fff;

    border: 1px solid #d1d5db;
    border-radius: 4px;
}

.legend-box-1.correct-1 {
    background: #16a34a;
    border-color: #16a34a;
}

.legend-box-1.wrong-1 {
    background: #dc2626;
    border-color: #dc2626;
}


/* =========================================================
   MOBILE MENU BUTTON
========================================================= */

.open-menu-btn-1 {
    display: none;
}


/* =========================================================
   PDF BUTTON
========================================================= */

.print-button-wrap {
    display: flex;
    justify-content: center;

    margin-top: 20px;
}

#showPrintPreview-1 {
    padding: 12px 24px;

    border: none;
    border-radius: 8px;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}


/* =========================================================
   PDF PREVIEW
========================================================= */

#pdfPreviewWrap-1 {
    position: fixed;

    top: 0;
    right: 0;
    bottom: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    margin: 0;
    padding: 30px 15px 60px;

    overflow-x: auto;
    overflow-y: auto;

    box-sizing: border-box;

    background: #525659;

    border: 0;

    z-index: 99999;
}

#pdfContent-1 {
    width: 794px;
    min-height: 1123px;

    margin: 0 auto;
    padding: 38px 42px;

    box-sizing: border-box;

    background: #fff;
    color: #111827;

    font-size: 18px;
    line-height: 1.55;

    box-shadow:
        0 8px 30px
        rgba(0, 0, 0, .14);
}

.pdf-question-item-1 {
    padding-bottom: 10px;

    break-inside: avoid;
    page-break-inside: avoid;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

    /* -----------------------------------------
       QUIZ LAYOUT
    ----------------------------------------- */

    .quiz-container-1 {
        display: block;
    }


    /* -----------------------------------------
       QUESTION
    ----------------------------------------- */

    .question-item-1 {
        margin-bottom: 15px;
        padding: 15px;

        border-radius: 11px;
    }

    .question-number-1 {
        font-size: 20px;
    }

    .question-text-1 {
        font-size: 18px;
    }


    /* -----------------------------------------
       ANSWERS
    ----------------------------------------- */

    .answers-1 {
        grid-template-columns: 1fr;
    }

    .answer-1 {
        width: 100%;

        padding: 0 14px;

        box-sizing: border-box;
    }

    .answer-content-1 {
        font-size: 17px;
    }


    /* -----------------------------------------
       TEXT ANSWER + BUTTON
    ----------------------------------------- */

    .text-answer-box-1 {
        flex-direction: column;

        width: 100%;

        gap: 10px;
    }

    .text-answer-input-1,
    .check-answer-btn-1 {
        width: 100%;
        height: 56px;
        min-height: 56px;

        box-sizing: border-box;
    }

    .text-answer-input-1 {
        padding: 0 16px;

        font-size: 18px;
    }

    .check-answer-btn-1 {
        padding: 0 16px;

        font-size: 17px;
    }


    /* -----------------------------------------
       MOBILE MENU BUTTON
    ----------------------------------------- */

    .open-menu-btn-1 {
        display: flex;

        position: fixed;
        right: 14px;
        bottom: 18px;

        align-items: center;
        justify-content: center;

        width: 54px;
        height: 54px;

        background: #2563eb;
        color: #fff;

        border: none;
        border-radius: 50%;

        font-size: 22px;

        box-shadow:
            0 5px 18px
            rgba(0, 0, 0, .2);

        cursor: pointer;

        z-index: 999;
    }


    /* -----------------------------------------
       MOBILE SIDEBAR
    ----------------------------------------- */

    .quiz-sidebar-1 {
        position: fixed;

        top: 0;
        right: -100%;

        width: min(330px, 90vw);
        height: 100vh;

        padding: 18px;

        overflow-y: auto;

        border-radius: 0;

        transition: right .28s ease;

        box-shadow:
            -5px 0 20px
            rgba(0, 0, 0, .12);

        z-index: 9999;
    }

    .quiz-sidebar-1.open-1 {
        right: 0;
    }

    .quiz-close-btn-1 {
        display: flex;

        align-items: center;
        justify-content: center;

        width: 40px;
        height: 40px;

        margin-left: auto;

        background: transparent;

        border: 0;

        font-size: 30px;

        cursor: pointer;
    }


    /* -----------------------------------------
       PDF MOBILE
    ----------------------------------------- */

    #pdfPreviewWrap-1 {
        padding: 15px 0;
    }

    #pdfContent-1 {
        box-shadow: none;

        transform-origin: top left;
    }
}
img {
   max-width: 100%;
    height: auto;
    display: block;
}
</style>

            /* =================================================

            function delay(ms) {

                return new Promise(
                    function (resolve) {

                        setTimeout(
                            resolve,
                            ms
                        );

                    }
                );

            }


            /* =================================================
               CHECK LIBRARY
            ================================================= */

            function checkLibraries() {


                if (
                    typeof html2canvas ===
                    "undefined"
                ) {

                    throw new Error(
                        "html2canvas chưa được tải."
                    );

                }


                if (
                    !window.jspdf ||

                ) {

                    );

            /* =================================================
               WAIT IMAGE
            ================================================= */

            async function waitImagesReady(
                root
            ) {


                const images =
                    Array.from(
                        root.querySelectorAll(
                            "img"
                        )
                    );


                await Promise.all(

                    images.map(
                        function (img) {


                            if (
                                img.complete &&
                                img.naturalWidth > 0
                            ) {


                                if (
                                    img.decode
                                ) {

                                    return img
                                        .decode()
                                        .catch(
                                            function () {}
                                        );

                                }


                                return Promise.resolve();

                            }


                            return new Promise(
                                function (
                                    resolve
                                ) {


                                    let done =
                                        false;


                                    function finish() {


                                        if (done) {
                                            return;
                                        }


                                        done =
                                            true;


                                        resolve();

                                    }


                                    img.addEventListener(
                                        "load",
                                        finish,
                                        {
                                            once:
                                                true
                                        }
                                    );


                                    img.addEventListener(
                                        "error",
                                        finish,
                                        {
                                            once:
                                                true
                                        }
                                    );


                                    setTimeout(
                                        finish,
                                        10000
                                    );

                                }
                            );

                        }
                    )

                );

            }


            /* =================================================
               IMAGE URL -> BASE64
            ================================================= */

            async function imageUrlToDataURL(
                url
            ) {


                try {


                    const response =
                        await fetch(
                            url,
                            {
                                mode:
                                    "cors",

                                cache:
                                    "force-cache"
                            }
                        );


                    if (
                        !response.ok
                    ) {

                        return null;

                    }


                    const blob =
                        await response.blob();


                    return await new Promise(
                        function (
                            resolve,
                            reject
                        ) {


                            const reader =
                                new FileReader();


                            reader.onloadend =
                                function () {

                                    resolve(
                                        reader.result
                                    );

                                };


                            reader.onerror =
                                reject;


                            reader.readAsDataURL(
                                blob
                            );

                        }
                    );

                }

                catch (
                    error
                ) {


                    console.warn(
                        "Không chuyển được ảnh:",
                        url
                    );


                    return null;

                }

            }


            /* =================================================
               PREPARE IMAGE
            ================================================= */

            async function prepareImagesForPdf(
                root
            ) {


                const images =
                    Array.from(
                        root.querySelectorAll(
                            "img"
                        )
                    );


                for (
                    let i = 0;
                    i < images.length;
                    i++
                ) {


                    const img =
                        images[i];


                    let src =
                        img.getAttribute(
                            "src"
                        );


                    if (!src) {
                        continue;
                    }


                    if (
                        src.startsWith(
                            "data:"
                        ) ||
                        src.startsWith(
                            "blob:"
                        )
                    ) {

                        continue;

                    }


                    try {

                        src =
                            new URL(
                                src,
                                window.location.href
                            ).href;

                    }

                    catch (
                        error
                    ) {}


                    const dataUrl =
                        await imageUrlToDataURL(
                            src
                        );


                    if (
                        dataUrl
                    ) {


                        img.removeAttribute(
                            "crossorigin"
                        );


                        img.src =
                            dataUrl;


                        try {

                            if (
                                img.decode
                            ) {

                                await img.decode();

                            }

                        }

                        catch (
                            error
                        ) {}

                    }


                    await delay(
                        20
                    );

                }

            }

                function updateScale() {


                    if (
                        window.innerWidth >
                        850
                    ) {

                        pdfContent.style.transform =
                            "";


                        pdfContent.style.transformOrigin =
                            "";


                        pdfContent.style.marginBottom =
                            "";


                        return;

                    }


                    const scale =
                        Math.min(

                            1,

                            (
                                window.innerWidth -
                                10
                            ) /

                            794

                        );


                    pdfContent.style.transform =
                        "scale(" +
                        scale +
                        ")";


                    pdfContent.style.transformOrigin =
                        "top left";


                    pdfContent.style.marginBottom =

                        "-" +

                        (
                            pdfContent.offsetHeight *

                            (
                                1 -
                                scale
                            )
                        ) +

                        "px";

                }


                updateScale();


                window.addEventListener(
                    "resize",
                    updateScale
                );

            /* =================================================
               ELEMENT -> CANVAS
            ================================================= */

            async function toCanvas(
                element
            ) {


                return await html2canvas(
                    element,
                    {

                        scale:
                            window.innerWidth <= 768
                                ? 1.15
                                : 1.5,

                        useCORS:
                            true,

                        allowTaint:
                            false,

                        backgroundColor:
                            "#fff",

                        logging:
                            false,

                        imageTimeout:
                            15000,

                        windowWidth:
                            794

                    }
                );

            }


            /* =================================================
               EXPORT
            ================================================= */

            async function exportPdf(
                pdfContent
            ) {


                checkLibraries();


                const jsPDF =
                    window.jspdf.jsPDF;


                const oldTransform =
                    pdfContent.style.transform;


                const oldTransformOrigin =
                    pdfContent.style.transformOrigin;


                const oldMargin =
                    pdfContent.style.marginBottom;


                /*
                 * Khi chụp PDF:
                 * bỏ scale mobile
                 */

                pdfContent.style.transform =
                    "none";


                pdfContent.style.transformOrigin =
                    "top left";


                pdfContent.style.marginBottom =
                    "0";


                try {


                    await prepareImagesForPdf(
                        pdfContent
                    );


                    await waitImagesReady(
                        pdfContent
                    );


                    await delay(
                        100
                    );


                    const pdf =
                        new jsPDF({

                            orientation:
                                "portrait",

                            unit:
                                "mm",

                            format:
                                "a4",

                            compress:
                                true

                        });


                    const PAGE_W =
                        210;


                    const PAGE_H =
                        297;


                    const LEFT =
                        12;


                    const RIGHT =
                        12;


                    const TOP =
                        12;


                    const BOTTOM =
                        18;


                    const CONTENT_W =
                        PAGE_W -
                        LEFT -
                        RIGHT;


                    const MAX_Y =
                        PAGE_H -
                        BOTTOM;


                    let y =
                        TOP;


                    const blocks =
                        [];


                    const header =
                        pdfContent.querySelector(
                            ".pdf-header-1"
                        );


                    if (
                        header
                    ) {

                        blocks.push(
                            header
                        );

                    }


                    pdfContent
                        .querySelectorAll(
                            ".pdf-question-item-1"
                        )
                        .forEach(
                            function (
                                item
                            ) {

                                blocks.push(
                                    item
                                );

                            }
                        );


                    /* =========================================
                       RENDER TỪNG BLOCK
                    ========================================= */

                    for (
                        let i = 0;
                        i < blocks.length;
                        i++
                    ) {


                        const block =
                            blocks[i];


                        await prepareImagesForPdf(
                            block
                        );


                        await waitImagesReady(
                            block
                        );


                        const canvas =
                            await toCanvas(
                                block
                            );


                        if (
                            !canvas ||
                            !canvas.width ||
                            !canvas.height
                        ) {

                            continue;

                        }


                        const image =
                            canvas.toDataURL(
                                "image/jpeg",
                                .92
                            );


                        let width =
                            CONTENT_W;


                        let height =
                            canvas.height *
                            width /
                            canvas.width;


                        /*
                         * Không đủ chỗ
                         * => sang trang mới
                         */

                        if (
                            y +
                            height >
                            MAX_Y &&
                            y >
                            TOP
                        ) {


                            pdf.addPage();


                            y =
                                TOP;

                        }


                        /*
                         * Block cao hơn cả 1 trang
                         */

                        const maxHeight =
                            PAGE_H -
                            TOP -
                            BOTTOM;


                        if (
                            height >
                            maxHeight
                        ) {


                            const ratio =
                                maxHeight /
                                height;


                            width *=
                                ratio;


                            height *=
                                ratio;

                        }


                        pdf.addImage(

                            image,

                            "JPEG",

                            LEFT,

                            y,

                            width,

                            height,

                            undefined,

                            "FAST"

                        );


                        y +=
                            height +
                            4;


                        /*
                         * Giải phóng canvas
                         */

                        canvas.width =
                            1;


                        canvas.height =
                            1;


                        await delay(
                            30
                        );

                    }


                    /* =========================================
                       FOOTER
                    ========================================= */

                    const pages =
                        pdf.getNumberOfPages();


                    for (
                        let page = 1;
                        page <= pages;
                        page++
                    ) {


                        pdf.setPage(
                            page
                        );


                        pdf.setFontSize(
                            9
                        );


                        pdf.setTextColor(
                            100,
                            116,
                            139
                        );


                        pdf.text(

                            "2026 - https://hminhquan2026.blogspot.com/",

                            PAGE_W / 2,

                            289,

                            {
                                align:
                                    "center"
                            }

                        );


                        pdf.text(

                            page +
                            " / " +
                            pages,

                            PAGE_W -
                            RIGHT,

                            289,

                            {
                                align:
                                    "right"
                            }

                        );

                    }


                    /* =========================================
                       FILE NAME
                    ========================================= */

                    let fileName =
                        "toan-lop-2.pdf";


                    const subtitle =
                        document.querySelector(
                            ".subtitle"
                        );


                    if (
                        subtitle &&
                        subtitle.textContent.trim()
                    ) {


                        const clean =
                            subtitle.textContent
                            .trim()
                            .normalize(
                                "NFD"
                            )
                            .replace(
                                /[\u0300-\u036f]/g,
                                ""
                            )
                            .replace(
                                /đ/g,
                                "d"
                            )
                            .replace(
                                /Đ/g,
                                "D"
                            )
                            .replace(
                                /[^a-zA-Z0-9]+/g,
                                "-"
                            )
                            .replace(
                                /^-+|-+$/g,
                                ""
                            )
                            .toLowerCase();


                        if (
                            clean
                        ) {

                            fileName =
                                clean +
                                ".pdf";

                        }

                    }


                    pdf.save(
                        fileName
                    );

                }

                finally {


                    /*
                     * Trả lại trạng thái preview
                     */

                    pdfContent.style.transform =
                        oldTransform;


                    pdfContent.style.transformOrigin =
                        oldTransformOrigin;


                    pdfContent.style.marginBottom =
                        oldMargin;

                }

            }


            /* =================================================
               BUTTON
            ================================================= */

            showBtn.addEventListener(
                "click",
                function () {

                    createPreview();

                }
            );


        }
    );

})();

   const quizQuestions = QuizQuestionPicker.init({

========================================= */

(function (window) {
    "use strict";

    function shuffleArray(array) {

        const result = array.slice();

        for (let i = result.length - 1; i > 0; i--) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                result[i],
                result[j]
            ] = [
                result[j],
                result[i]
            ];
        }

        return result;
    }


    function matchCondition(question, conditions) {

        if (!conditions) {
            return true;
        }

        /*
         * conditions có thể chứa:
         *
         * made
         * type
         * dangcauhoi
         *
         * hoặc các key khác sau này.
         */

        for (const key in conditions) {

            if (
                !Object.prototype.hasOwnProperty.call(
                    conditions,
                    key
                )
            ) {
                continue;
            }

            const expected =
                conditions[key];

            /*
             * Nếu điều kiện là undefined/null/""
             * thì bỏ qua.
             */

            if (
                expected === undefined ||
                expected === null ||
                expected === ""
            ) {
                continue;
            }


            /*
             * Nếu expected là Array:
             *
             * type: ["text", "multi"]
             *
             * thì chỉ cần giá trị question[key]
             * nằm trong array đó.
             */

            if (Array.isArray(expected)) {

                if (
                    !expected.includes(
                        question[key]
                    )
                ) {
                    return false;
                }

                continue;
            }


            /*
             * Điều kiện thông thường:
             *
             * made: 1
             * type: "text"
             * dangcauhoi: 5
             */

            if (
                question[key] !== expected
            ) {
                return false;
            }
        }

        return true;
    }


    function filterQuestions(
        questions,
        conditions
    ) {

        return questions.filter(
            function (question) {

                return matchCondition(
                    question,
                    conditions
                );
            }
        );
    }


    window.QuizQuestionPicker = {

        init: function (options) {

            options =
                options || {};


            /* =========================
               KIỂM TRA DATA
            ========================= */

            const sourceQuestions =
                Array.isArray(
                    options.questions
                )
                    ? options.questions
                    : [];


            if (
                sourceQuestions.length === 0
            ) {

                return [];
            }


            /* =========================
               LỌC THEO ĐIỀU KIỆN
            ========================= */

            let result =
                filterQuestions(
                    sourceQuestions,
                    options.conditions
                );


            /* =========================
               ĐẢO THỨ TỰ CÂU HỎI
            ========================= */

            result =
                shuffleArray(result);


            /* =========================
               SỐ CÂU MUỐN LẤY
            ========================= */

            let total =
                Number(options.total);


            /*
             * Nếu không truyền total
             * hoặc total không hợp lệ
             * thì lấy toàn bộ.
             */

            if (
                !Number.isFinite(total) ||
                total <= 0
            ) {

                total =
                    result.length;
            }


            total =
                Math.floor(total);


            /*
             * Nếu data > total:
             * lấy đúng total.
             *
             * Nếu data < total:
             * lấy bằng data.
             */

            total =
                Math.min(
                    total,
                    result.length
                );


            /* =========================
               TRẢ VỀ MẢNG ĐÃ CHỌN
            ========================= */

            return result.slice(
                0,
                total
            );
        }
    };

})(window);




/* ================================
   RENDER CÂU HỎI
   Chỉ render HTML - không chấm điểm
================================ */

(function (window) {
    "use strict";

    let questions = [];

    let settings = {
        folder: "",
        shuffleAnswers: false
    };


    /* ================================
       XỬ LÝ ĐƯỜNG DẪN ẢNH
    ================================ */

    function getImageUrl(src) {

        if (!src) return "";

        src = String(src).trim();

        if (
            src.indexOf("http://") === 0 ||
            src.indexOf("https://") === 0 ||
            src.indexOf("//") === 0 ||
            src.indexOf("data:") === 0 ||
            src.indexOf("blob:") === 0
        ) {
            return src;
        }

        if (settings.folder) {

            return (
                MEDIA_URL.replace(/\/+$/, "") +
                "/" +
                String(settings.folder)
                    .trim()
                    .replace(/^\/+|\/+$/g, "") +
                "/" +
                src.replace(/^\/+/, "")
            );
        }

        return (
            MEDIA_URL.replace(/\/+$/, "") +
            "/" +
            src.replace(/^\/+/, "")
        );
    }


    /* ================================
       SỬA SRC ẢNH TRONG HTML
    ================================ */

    function fixImages(element) {

        if (!element) return;

        element
            .querySelectorAll("img")
            .forEach(function (img) {

                const src =
                    img.getAttribute("src");

                if (src) {
                    img.src =
                        getImageUrl(src);
                }

            });
    }


    /* ================================
       TRỘN MẢNG
    ================================ */

    function shuffleArray(array) {

        const result = array.slice();

        for (
            let i = result.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            [
                result[i],
                result[j]
            ] = [
                result[j],
                result[i]
            ];
        }

        return result;
    }


    /* ================================
       FORMAT SOLUTION
    ================================ */

    function formatSolution(value) {

        if (
            value === undefined ||
            value === null
        ) {
            return "";
        }

        return String(value)
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/\n/g, "<br>");
    }


    /* ================================
       TẠO 1 CÂU HỎI
    ================================ */

    function createQuestion(
        question,
        index
    ) {

        const questionId =
            index + 1;

        const htmlType =
            question.type === "text"
                ? "text"
                : "radio";


        /* ================================
           SECTION
        ================================ */

        const section =
            document.createElement(
                "section"
            );

        section.className =
            "question-item-1";

        section.id =
            "question-" +
            questionId +
            "-1";

        section.setAttribute(
            "data-question-index",
            questionId
        );

        section.setAttribute(
            "data-type",
            htmlType
        );

        section.setAttribute(
            "data-answer",
            question.answer ?? ""
        );


        /* ================================
           TIÊU ĐỀ CÂU
        ================================ */

        const questionNumber =
            document.createElement(
                "h2"
            );

        questionNumber.className =
            "question-number-1";

        questionNumber.textContent =
            "Câu " + questionId;

        section.appendChild(
            questionNumber
        );


        /* ================================
           NỘI DUNG CÂU HỎI
        ================================ */

        const questionText =
            document.createElement(
                "div"
            );

        questionText.className =
            "question-text-1";

        questionText.innerHTML =
            question.cauhoi || "";

        fixImages(
            questionText
        );

        section.appendChild(
            questionText
        );


        /* ================================
           ẢNH CÂU HỎI
        ================================ */

        if (
            question.img &&
            String(question.img).trim()
        ) {

            const imageWrap =
                document.createElement(
                    "div"
                );

            imageWrap.className =
                "question-image-1";


            const image =
                document.createElement(
                    "img"
                );

            image.src =
                getImageUrl(
                    question.img
                );

            image.alt =
                "Hình câu " +
                questionId;


            imageWrap.appendChild(
                image
            );

            section.appendChild(
                imageWrap
            );
        }


        /* ================================
           CÂU TEXT
        ================================ */

        if (
            question.type === "text"
        ) {

            const answerBox =
                document.createElement(
                    "div"
                );

            answerBox.className =
                "text-answer-box-1";


            const input =
                document.createElement(
                    "input"
                );

            input.type =
                "text";

            input.className =
                "text-answer-input-1";

            input.placeholder =
                "Nhập đáp án...";

            input.autocomplete =
                "off";


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "check-answer-btn-1";

            button.textContent =
                "Trả lời";


            answerBox.appendChild(
                input
            );

            answerBox.appendChild(
                button
            );

            section.appendChild(
                answerBox
            );
        }


        /* ================================
           CÂU TRẮC NGHIỆM
        ================================ */

        else {

            const answersWrap =
                document.createElement(
                    "div"
                );

            answersWrap.className =
                "answers-1";


            let answers = [
                question.answer,
                ...(
                    Array.isArray(
                        question.wrong_answers
                    )
                        ? question.wrong_answers
                        : []
                )
            ];


            answers = [
                ...new Set(
                    answers
                        .filter(
                            function (answer) {

                                return (
                                    answer !== undefined &&
                                    answer !== null
                                );
                            }
                        )
                        .map(String)
                )
            ];


            if (
                settings.shuffleAnswers
            ) {

                answers =
                    shuffleArray(
                        answers
                    );
            }


            answers.forEach(
                function (
                    answer,
                    answerIndex
                ) {

                    const label =
                        document.createElement(
                            "label"
                        );

                    label.className =
                        "answer-1";


                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "radio";

                    input.name =
                        "question-" +
                        questionId +
                        "-1";

                    input.value =
                        answer;


                    const answerLabel =
                        document.createElement(
                            "span"
                        );

                    answerLabel.className =
                        "answer-label-1";

                    answerLabel.textContent =
                        String.fromCharCode(
                            65 +
                            answerIndex
                        );


                    const answerContent =
                        document.createElement(
                            "span"
                        );

                    answerContent.className =
                        "answer-content-1";

                    answerContent.innerHTML =
                        answer;

                    fixImages(
                        answerContent
                    );


                    label.appendChild(
                        input
                    );

                    label.appendChild(
                        answerLabel
                    );

                    label.appendChild(
                        answerContent
                    );

                    answersWrap.appendChild(
                        label
                    );
                }
            );


            section.appendChild(
                answersWrap
            );
        }


        /* ================================
           GIẢI THÍCH
        ================================ */

        const solution =
            document.createElement(
                "div"
            );

        solution.className =
            "solution-1";

        solution.innerHTML =
            "<strong>Giải thích:</strong><br>" +
            formatSolution(
                question.solution
            );

        fixImages(
            solution
        );

        section.appendChild(
            solution
        );


        return section;
    }


    /* ================================
       RENDER SIDEBAR
    ================================ */

    function renderSidebarQuestionNumbers() {

        const grid =
            document.getElementById(
                "questionGrid-1"
            );

        if (!grid) return;


        const questionElements =
            document.querySelectorAll(
                ".question-item-1"
            );


        grid.innerHTML = "";


        questionElements.forEach(
            function (
                questionElement,
                index
            ) {

                const questionNumber =
                    index + 1;


                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "question-btn-1";

                button.textContent =
                    questionNumber;


                button.setAttribute(
                    "data-question-index",
                    questionNumber
                );


                button.addEventListener(
                    "click",
                    function () {

                        questionElement
                            .scrollIntoView({
                                behavior: "smooth",
                                block: "start"
                            });

                    }
                );


                grid.appendChild(
                    button
                );

            }
        );


        /* ================================
           STATS BAN ĐẦU
        ================================ */

        const unanswered =
            document.getElementById(
                "unansweredCount-1"
            );

        const answered =
            document.getElementById(
                "answeredCount-1"
            );


        if (unanswered) {
            unanswered.textContent =
                questionElements.length;
        }

        if (answered) {
            answered.textContent =
                0;
        }
    }


    /* ================================
       RENDER TOÀN BỘ
    ================================ */

    function render() {

        const container =
            document.getElementById(
                "questionsList-1"
            );

        if (!container) {

            console.error(
                "Không tìm thấy #questionsList-1"
            );

            return;
        }


        container.innerHTML =
            "";


        questions.forEach(
            function (
                question,
                index
            ) {

                container.appendChild(
                    createQuestion(
                        question,
                        index
                    )
                );

            }
        );


        /*
         * Sau khi render xong câu hỏi
         * => render số câu sidebar
         */
        renderSidebarQuestionNumbers();
    }


    /* ================================
       PUBLIC API
    ================================ */

    window.RenderQuizHtml = {

        init: function (options) {

            options =
                options || {};


            if (
                !Array.isArray(
                    options.questions
                )
            ) {

                console.error(
                    "RenderQuizHtml.init(): questions phải là Array."
                );

                return;
            }


            questions =
                options.questions.slice();


            settings = {

                folder:
                    options.folder ||
                    "",

                shuffleAnswers:
                    options.shuffleAnswers ===
                    true
            };


            render();
        },


        /* ================================
           RENDER LẠI
        ================================ */

        render: function () {

            render();
        },


        /* ================================
           LẤY QUESTIONS
        ================================ */

        getQuestions: function () {

            return questions.slice();
        },


        /* ================================
           DESTROY
        ================================ */

        destroy: function () {

            const container =
                document.getElementById(
                    "questionsList-1"
                );

            if (container) {

                container.innerHTML =
                    "";
            }


            const grid =
                document.getElementById(
                    "questionGrid-1"
                );

            if (grid) {

                grid.innerHTML =
                    "";
            }


            const unanswered =
                document.getElementById(
                    "unansweredCount-1"
                );

            const answered =
                document.getElementById(
                    "answeredCount-1"
                );


            if (unanswered) {
                unanswered.textContent =
                    0;
            }

            if (answered) {
                answered.textContent =
                    0;
            }


            questions = [];
        }
    };


})(window);
  
 const quizQuestions = QuizQuestionPicker.init({

    total: 15,

});
  
  

  var folder = "timo_k2";

RenderQuizHtml.init({
    questions: quizQuestions,
    folder: folder,
    shuffleAnswers: true
});
</script>
